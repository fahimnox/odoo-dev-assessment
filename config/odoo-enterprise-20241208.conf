[options]
; Odoo configuration for the matched Enterprise service (odoo-ee-20241208) of
; the local Docker setup (see docs/environment.md and docs/enterprise_transition.md).
; This file contains no secrets. Database host, user and password come from the
; PG* environment variables in compose.yaml; the password itself lives only in
; the ignored .env file.
;
; Addons path: Odoo always searches its own core folder first. Here that is the
; official Community source's odoo/addons (base and core test modules), mounted
; over the image's package. Then come, in this order: the official Community
; addons/, the 620 Enterprise-repository modules of build 18.0+e.20241208
; (private folder), and our addons/.
addons_path = /mnt/community-addons,/mnt/enterprise-addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Disable the database manager: no listing, creation, backup or deletion of
; databases over HTTP or RPC. Databases are managed with scripts/dev.sh instead.
list_db = False
log_level = info
