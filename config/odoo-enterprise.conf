[options]
; Odoo configuration for the Enterprise service (odoo-ee) of the local Docker
; setup (see docs/environment.md and docs/enterprise_transition.md).
; This file contains no secrets. Database host, user and password come from the
; PG* environment variables in compose.yaml; the password itself lives only in
; the ignored .env file.
;
; Addons path: Odoo always searches its own core addons folder first (the
; Community addons of the pinned image), then the folders listed here, in this
; order. /mnt/enterprise-addons is the private Enterprise addons folder, mounted
; read-only from ENTERPRISE_ADDONS in .env; /mnt/extra-addons is our addons/.
addons_path = /mnt/enterprise-addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; Disable the database manager: no listing, creation, backup or deletion of
; databases over HTTP or RPC. Databases are managed with scripts/dev.sh instead.
list_db = False
log_level = info
