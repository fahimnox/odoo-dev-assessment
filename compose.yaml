# Local development environment: Odoo 18 + PostgreSQL 16.
# - odoo:    Odoo 18 Community (Stage 01 baseline), serves azk_dev on port 8069.
# - odoo-ee: the same pinned image plus a private Enterprise addons folder
#            (ENTERPRISE_ADDONS in .env), serves azk_ent on port 8070.
#            Stage 01B pair (2026 core, 2024 Enterprise); blocked, kept for azk_ent.
# - odoo-ee-20241208: matched pair (official Community 4e5027c1 with the
#            Enterprise addons of the same 2024-12-08 build), serves azk_ee24 on
#            port 8071.
# Images are pinned by digest. Run everything through scripts/dev.sh
# (see docs/environment.md). Secrets come from the ignored .env file.
name: azk-odoo-assessment

services:
  db:
    # postgres:16 (16.15 at pin time)
    image: postgres:16@sha256:5db6dac2ef5dcff512f4f00a009c3c332b9f2f28f24277175bf3e4a3d02ef83a
    environment:
      # Bootstrap superuser, used only inside this container for initialization.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Odoo's application role, created by docker/db/init on first start.
      ODOO_DB_USER: odoo
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the odoo service can reach PostgreSQL.
    restart: "no"

  odoo:
    # odoo:18.0 (Odoo 18.0-20261015 nightly build at pin time)
    image: odoo:18.0@sha256:9668abacd894276ed009e8db7db1d1ffb8068af6982f76a3400ed0d68e40432d
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by the image entrypoint and by libpq for one-off processes.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    # The web server always serves the development database only.
    command: ["odoo", "--database=azk_dev", "--db-filter=^azk_dev$$"]
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    restart: "no"

  odoo-ee:
    # Enterprise service: the Community server of the same pinned image, with the
    # Enterprise addons folder added to the addons path, which is how the official
    # documentation describes running Enterprise. The Enterprise source is
    # proprietary: it stays outside this repository and is mounted read-only.
    # Started only by scripts/dev.sh (ODOO_EDITION=enterprise) or --profile enterprise.
    profiles: ["enterprise"]
    image: odoo:18.0@sha256:9668abacd894276ed009e8db7db1d1ffb8068af6982f76a3400ed0d68e40432d
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    # The web server always serves the Enterprise development database only.
    # It listens on the same port inside and outside the container: wkhtmltopdf
    # runs inside the container and downloads the report CSS from web.base.url,
    # which a browser login sets to http://127.0.0.1:<host port>.
    command: ["odoo", "--http-port=${ODOO_EE_HTTP_PORT:-8070}", "--database=azk_ent", "--db-filter=^azk_ent$$"]
    ports:
      - "127.0.0.1:${ODOO_EE_HTTP_PORT:-8070}:${ODOO_EE_HTTP_PORT:-8070}"
    volumes:
      - ./config/odoo-enterprise.conf:/etc/odoo/odoo.conf:ro
      # Docker Desktop on Windows still creates a missing source folder despite
      # create_host_path: false, so scripts/dev.sh checks ENTERPRISE_ADDONS first.
      - type: bind
        source: ${ENTERPRISE_ADDONS:-./.enterprise-addons-not-configured}
        target: /mnt/enterprise-addons
        read_only: true
        bind:
          create_host_path: false
      - ./addons:/mnt/extra-addons
      # Separate data volume: Enterprise filestores and sessions never mix with
      # the Community ones.
      - odoo-ee-data:/var/lib/odoo
    restart: "no"

  odoo-ee-20241208:
    # Matched Enterprise pair (Stage 01B follow-up): the official Community source
    # odoo/odoo 4e5027c159a9d9a8dd006618486c8e54cb1eb453 (18.0, 2024-12-08) with
    # the Enterprise addons of build 18.0+e.20241208, the composition Odoo built
    # and shipped. The pinned image provides Python, its libraries and wkhtmltopdf.
    # Its own Odoo package is hidden by the read-only mount of the official odoo/
    # folder; no file is changed. Sources stay outside this repository.
    # Started only by scripts/dev.sh (ODOO_EDITION=enterprise-20241208) or --profile enterprise.
    profiles: ["enterprise"]
    image: odoo:18.0@sha256:9668abacd894276ed009e8db7db1d1ffb8068af6982f76a3400ed0d68e40432d
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: odoo
      PGPASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    # Serves its own development database only, on the same port inside and
    # outside the container (wkhtmltopdf reaches web.base.url from inside).
    command: ["odoo", "--http-port=${ODOO_EE_20241208_HTTP_PORT:-8071}", "--database=azk_ee24", "--db-filter=^azk_ee24$$"]
    ports:
      - "127.0.0.1:${ODOO_EE_20241208_HTTP_PORT:-8071}:${ODOO_EE_20241208_HTTP_PORT:-8071}"
    volumes:
      - ./config/odoo-enterprise-20241208.conf:/etc/odoo/odoo.conf:ro
      # Docker Desktop on Windows creates missing source folders despite
      # create_host_path: false, so scripts/dev.sh checks both sources first.
      - type: bind
        source: ${COMMUNITY_SOURCE_20241208:-./.community-source-not-configured}/odoo
        target: /usr/lib/python3/dist-packages/odoo
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COMMUNITY_SOURCE_20241208:-./.community-source-not-configured}/addons
        target: /mnt/community-addons
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ENTERPRISE_ADDONS:-./.enterprise-addons-not-configured}
        target: /mnt/enterprise-addons
        read_only: true
        bind:
          create_host_path: false
      - ./addons:/mnt/extra-addons
      # Own data volume: never shares filestores or sessions with other services.
      - odoo-ee-20241208-data:/var/lib/odoo
    restart: "no"

volumes:
  db-data:
  odoo-data:
  odoo-ee-data:
  odoo-ee-20241208-data:
